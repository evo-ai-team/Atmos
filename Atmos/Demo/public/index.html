<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e6eff3">
  <meta name="description" content="Plan a San Francisco visit with Atmos, from the first transit ride to the last stop of the night.">
  <title>San Francisco route · Atmos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b427c'/%3E%3Cpath d='m5 22 10-13 12 13M8 23l9-7 8 7' fill='none' stroke='%23fff' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#day-plan" hidden>Skip to stops</a>
  <main id="top">
    <div id="dashboard" aria-busy="true"><p class="loading-note" role="status">Opening Atmos…</p></div>
  </main>
  <template id="home-template">
    <section class="arrival-stage" aria-labelledby="home-title">
      <div class="arrival-content">
        <div class="arrival-wordmark">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="m5 23 10-14 12 14M9 23l8-7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Atmos
        </div>
        <h1 id="home-title">What’s the plan?</h1>
        <form id="home-form" class="arrival-composer">
          <textarea id="home-prompt" name="transcript" aria-label="Your trip request" placeholder="Paste your trip prompt here…" rows="3" maxlength="6000" required></textarea>
          <div class="arrival-actions">
            <button type="button" id="home-mic" class="arrival-mic" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 10.5v1a6.5 6.5 0 0 0 13 0v-1M12 18v3.5m-3 0h6"/></svg>
              <span data-mic-label>Use microphone</span>
            </button>
            <button type="submit" id="home-submit" class="arrival-submit">
              Plan my day
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 12h14m-6-6 6 6-6 6"/></svg>
            </button>
          </div>
          <p id="home-status" role="status"></p>
        </form>
        <a id="resume-trip" class="arrival-resume" href="/?view=trip" hidden>Resume saved day</a>
      </div>
      <small class="arrival-credit"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a> · OpenFreeMap · OpenMapTiles</small>
    </section>
  </template>
  <template id="planning-template">
    <section class="arrival-stage" aria-labelledby="planning-title">
      <div class="arrival-planning">
        <svg class="planning-trace" viewBox="0 0 160 88" fill="none" aria-hidden="true">
          <defs><path id="planning-trail" d="M17 65h19c14 0 15-28 29-28h25c13 0 15 16 27 16h5c12 0 13-29 22-29" pathLength="100"/></defs>
          <use href="#planning-trail"/>
          <use class="planning-ink" href="#planning-trail"/>
          <circle cx="17" cy="65" r="4.5"/><circle cx="77" cy="37" r="4.5"/><circle cx="144" cy="24" r="4.5"/>
        </svg>
        <h1 id="planning-title" tabindex="-1">Calculating routes…</h1>
        <p id="planning-status" role="status" aria-atomic="true">Reading your trip briefing…</p>
      </div>
      <small class="arrival-credit"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a> · OpenFreeMap · OpenMapTiles</small>
    </section>
  </template>
  <dialog id="detail-dialog" class="dialog" aria-labelledby="detail-title">
    <div class="sheet-header">
      <h2 id="detail-title"></h2>
      <button class="icon-button" data-close="detail-dialog" aria-label="Close details">×</button>
    </div>
    <div id="detail-content"></div>
  </dialog>
  <dialog id="brief-dialog" class="dialog" aria-labelledby="brief-title">
    <form id="brief-form">
      <div class="dialog-heading"><span class="eyebrow">Trip briefing</span><button type="button" class="icon-button" data-close="brief-dialog" aria-label="Close briefing">×</button></div>
      <h2 id="brief-title">Tell Atmos your plans.</h2>
      <label for="transcript">Your trip request</label>
      <textarea id="transcript" name="transcript" rows="7" maxlength="6000" required></textarea>
      <div id="memory-profile"></div>
      <p class="dialog-status" id="voice-status" role="status"></p>
      <div class="dialog-actions"><button type="button" class="btn secondary" id="voice-button">Use microphone</button><button type="submit" class="btn primary" id="start-button">Build my day</button></div>
    </form>
  </dialog>
  <dialog id="alert-dialog" class="dialog" aria-labelledby="alert-title"><div id="alert-content"></div><p id="alert-feedback" class="dialog-status" role="status"></p></dialog>
  <dialog id="draft-dialog" class="dialog" aria-labelledby="draft-title">
    <div class="dialog-heading"><span class="eyebrow">Local demo draft</span><button type="button" class="icon-button" aria-label="Close draft" data-close="draft-dialog">×</button></div>
    <h2 id="draft-title"></h2><p id="draft-text"></p><p class="dialog-status" id="draft-status"></p>
    <div class="dialog-actions"><button type="button" class="btn primary" data-close="draft-dialog">Done</button></div>
  </dialog>
  <div class="notice" id="notice" role="status" hidden></div>
</body>
</html>
